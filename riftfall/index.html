<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1114">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Riftfall: Three Nations</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230b1114%22/%3E%3Cpath d=%22M16 3l7 13-7 13-7-13z%22 fill=%22%235ff3ff%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Oxanium:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a gritty sci-fi war MMO; cockpit glass over a living battlefield
   IDEA: a planet-side war table: three nations ring a glowing Rift mine
   PICTURE: the world itself, drawn live; the HUD frames it
   COLOUR and TYPE: dust ochre > ash olive > slate teal > rift indigo ground; faction blue, violet, red; Oxanium + Chakra Petch
   LAYOUT: status top-left, war clock top-centre, radar top-right, stick bottom-left, weapons bottom-right */
:root{--ink:#e8f1f4;--dim:#93a9b1;--edge:rgba(150,215,230,.22);--cy:#5ff3ff;--fer:#3d8bff;--aet:#c35cff;--chr:#ff4a3d;--gold:#ffd34d;
--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{height:100%;overflow:hidden;background:#0b1114;color:var(--ink);font:600 14px/1.3 'Chakra Petch',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(3,8,10,.55) 100%)}
.hidden{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none}
.pnl{background:linear-gradient(180deg,rgba(15,26,31,.86),rgba(8,14,18,.82));border:1px solid var(--edge);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
#lt{position:absolute;left:calc(10px + var(--sl));top:calc(8px + var(--st));width:214px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
#plate{width:100%;padding:7px 9px 8px}
.pl-top{display:flex;align-items:center;gap:6px;white-space:nowrap}
.pl-top b{flex:1;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.badge{width:12px;height:12px;border-radius:3px;transform:rotate(45deg);flex:none;background:var(--c)}
.lv{font:800 13px Oxanium,sans-serif;color:var(--gold)}
.bar{position:relative;height:13px;background:rgba(255,255,255,.08);border-radius:7px;overflow:hidden;margin-top:5px}
.bar i{position:absolute;inset:0;transform-origin:left center;background:var(--c);border-radius:inherit}
.bar span{position:absolute;inset:0;font:700 10px/13px Oxanium,sans-serif;text-align:center;color:#fff;text-shadow:0 1px 2px #000}
.hp{--c:linear-gradient(90deg,#c92a44,#ff6767)}.fp{--c:linear-gradient(90deg,#1b7fd0,#4fd2ff)}.xp{height:5px;margin-top:6px;--c:linear-gradient(90deg,#d9a520,#ffe27a)}
.bar .sh{background:linear-gradient(90deg,rgba(160,215,255,.0),rgba(190,230,255,.75));mix-blend-mode:screen}
#buffs{display:flex;gap:4px;margin-top:5px;min-height:0;flex-wrap:wrap}
#buffs span{font-size:10px;padding:1px 6px;border-radius:8px;background:rgba(95,243,255,.14);color:var(--cy);white-space:nowrap}
#wallet{display:flex;gap:10px;padding:4px 9px;font:700 12px Oxanium,sans-serif;white-space:nowrap}
#wallet span{display:flex;align-items:center;gap:4px}
#wallet i{width:8px;height:8px;border-radius:50%;display:inline-block}
#siege{position:absolute;left:calc(50vw - 10px - var(--sl));transform:translateX(-50%);top:0;width:252px;padding:5px 10px 7px;text-align:center}
#sgHead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#sgTitle{font-size:12px;color:var(--dim);white-space:nowrap}
#sgTitle.on{color:#ff7a6e}
#sgTime{font:800 17px Oxanium,sans-serif}
#sgDom{font-size:11px;color:var(--dim);text-align:left;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sgCores{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:4px}
.cb{height:6px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden;position:relative}
.cb i{position:absolute;inset:0;background:var(--c);transform-origin:left center}
#tgt{position:absolute;left:calc(50vw - 10px - var(--sl));transform:translateX(-50%);top:68px;width:220px;padding:5px 9px 7px;pointer-events:auto;cursor:pointer}
#tgName{display:flex;justify-content:space-between;font-size:12px;white-space:nowrap;gap:6px}
#tgName b{overflow:hidden;text-overflow:ellipsis}
#tgt .bar{height:8px;margin-top:4px}
#tgt .bar i{background:linear-gradient(90deg,#c92a44,#ff7a5a)}
#mmWrap{position:absolute;right:calc(10px + var(--sr));top:calc(8px + var(--st));width:118px;height:118px;border-radius:50%;padding:3px}
#mm{width:100%;height:100%;border-radius:50%;display:block}
#bounty{position:absolute;right:calc(10px + var(--sr));top:calc(var(--st) + 132px);width:150px;padding:5px 8px;font-size:11px;line-height:1.25}
#bounty b{color:var(--gold);font-size:10px;display:block}
#log{width:min(40vw,300px);font-size:12px;display:flex;flex-direction:column;gap:2px}
#log div{background:rgba(6,12,15,.55);padding:2px 7px;border-radius:6px;width:fit-content;max-width:100%;text-shadow:0 1px 1px #000;transition:opacity .6s}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 14px);width:max-content;max-width:min(44vw,400px);text-align:center;font-size:13px;padding:7px 12px;border-radius:18px;background:rgba(10,30,36,.88);border:1px solid rgba(95,243,255,.45);color:#d9fbff;pointer-events:none}
#banner{position:absolute;left:0;right:0;top:22%;text-align:center;pointer-events:none;opacity:0;transition:opacity .4s}
#banner h2{font:800 clamp(26px,5vw,48px)/1.05 Oxanium,sans-serif;letter-spacing:.02em;text-shadow:0 3px 18px rgba(0,0,0,.7)}
#banner p{font-size:15px;color:#dfeef2;margin-top:6px;text-shadow:0 2px 6px #000}
#topBtns{position:absolute;right:calc(136px + var(--sr));top:calc(8px + var(--st));display:flex;gap:6px;pointer-events:auto}
.tb{height:34px;min-width:34px;padding:0 10px;border-radius:9px;border:1px solid var(--edge);background:rgba(10,18,22,.82);font-size:12px;display:flex;align-items:center;gap:5px}
.tb svg{width:16px;height:16px}
#joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(180,230,240,.25);background:radial-gradient(circle,rgba(95,243,255,.06),rgba(10,18,22,.25));pointer-events:none;left:calc(90px + var(--sl));bottom:auto;top:calc(100% - 92px - var(--sb));opacity:.55;transition:opacity .2s}
#joy.on{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#4a6670,#1b2a30);border:1.5px solid rgba(180,230,240,.5)}
#acts{position:absolute;right:calc(8px + var(--sr));bottom:calc(8px + var(--sb));width:252px;height:236px;pointer-events:none;transform-origin:right bottom}
.act{position:absolute;pointer-events:auto;border-radius:50%;border:1.5px solid rgba(180,230,240,.38);background:radial-gradient(circle at 50% 32%,rgba(46,70,80,.95),rgba(9,16,20,.94));display:grid;place-items:center;touch-action:none;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.act svg{width:58%;height:58%;pointer-events:none}
.act::after{content:'';position:absolute;inset:-1px;border-radius:50%;background:conic-gradient(rgba(0,0,0,.66) calc(var(--cd,0)*360deg),transparent 0);pointer-events:none}
.act .cdt{position:absolute;z-index:2;font:800 16px Oxanium,sans-serif;text-shadow:0 1px 3px #000;pointer-events:none}
.act .cnt{position:absolute;right:-2px;bottom:-2px;z-index:2;font:800 10px Oxanium,sans-serif;background:#0b1418;border:1px solid var(--edge);border-radius:8px;padding:0 4px;pointer-events:none}
.act .nm{position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);font-size:9px;white-space:nowrap;color:var(--dim);pointer-events:none}
.act.low{filter:saturate(.3) brightness(.75)}
.act.press{transform:scale(.93)}
#aAtk{width:88px;height:88px;right:4px;bottom:4px;border-color:rgba(255,160,140,.55);background:radial-gradient(circle at 50% 32%,rgba(110,46,40,.95),rgba(30,10,10,.95))}
.sk{width:58px;height:58px}
#aS0{right:104px;bottom:6px}#aS1{right:90px;bottom:82px}#aS2{right:18px;bottom:106px}
.pot{width:44px;height:44px}
#aHp{right:176px;bottom:4px}#aFp{right:172px;bottom:56px}
#aUse{width:52px;height:52px;right:160px;bottom:116px;border-color:rgba(255,211,77,.5)}
#aUse.off{opacity:.35}
#aAuto{width:60px;height:28px;border-radius:14px;right:16px;bottom:178px;font:800 11px Oxanium,sans-serif}
#aAuto::after{display:none}
#aAuto.on{background:rgba(95,243,255,.22);border-color:var(--cy);color:var(--cy)}
#cast{position:absolute;left:50%;bottom:calc(30% + var(--sb));transform:translateX(-50%);width:200px;text-align:center;font-size:12px}
#cast div{height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:3px}
#cast i{display:block;height:100%;background:linear-gradient(90deg,#d9a520,#ffe27a);transform-origin:left center}
#death{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle,rgba(60,10,12,.55),rgba(5,5,8,.8));text-align:center;pointer-events:none}
#death h2{font:800 44px Oxanium,sans-serif;color:#ff6b6b}
#death p{margin-top:6px;color:#e6d0d0}
/* panel */
#panel{position:fixed;inset:0;display:grid;place-items:center;background:rgba(2,6,8,.55);padding:calc(10px + var(--st)) calc(10px + var(--sr)) calc(10px + var(--sb)) calc(10px + var(--sl));touch-action:auto}
.pbox{width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.pbox header{display:flex;gap:6px;align-items:center;padding:8px;border-bottom:1px solid var(--edge)}
#ptabs{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;padding:7px 11px;border-radius:8px;border:1px solid transparent;background:none;color:var(--dim);font-size:13px;white-space:nowrap}
.tab.on{background:rgba(95,243,255,.12);border-color:rgba(95,243,255,.4);color:var(--ink)}
#pClose{flex:none;width:40px;height:36px;border-radius:9px;border:1px solid var(--edge);background:rgba(255,255,255,.04);font-size:18px}
#pbody{overflow-y:auto;padding:10px 12px 14px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.row{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(150,215,230,.1)}
.row>div{flex:1}
.row small{display:block;color:var(--dim);font-size:12px;font-weight:500;margin-top:2px}
.row .ok{color:#7ee8a2}.row .no{color:#ff8a80}
.btn{flex:none;min-height:40px;padding:6px 12px;border-radius:9px;border:1px solid rgba(95,243,255,.45);background:rgba(95,243,255,.1);font-size:13px;white-space:nowrap}
.btn:disabled{opacity:.38;cursor:default}
.btn.warn{border-color:rgba(255,120,110,.6);background:rgba(255,90,80,.12)}
#pmsg{min-height:20px;font-size:13px;margin-bottom:4px}
#pmsg.ok{color:#7ee8a2}#pmsg.bad{color:#ff8a80}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:13px}
.kv span:nth-child(odd){color:var(--dim);font-weight:500}
.kv span:nth-child(even){text-align:right;font-family:Oxanium,sans-serif}
.help p{margin:0 0 9px;font-weight:500;font-size:13px;line-height:1.45}
.help b{color:var(--cy)}
.note{font-size:12px;color:var(--dim);font-weight:500;margin-top:8px}
/* title */
#title{position:fixed;inset:0;display:grid;place-items:center;padding:calc(12px + var(--st)) calc(12px + var(--sr)) calc(12px + var(--sb)) calc(12px + var(--sl));background:radial-gradient(ellipse at 50% 40%,rgba(5,10,14,.15),rgba(5,10,14,.7));overflow:auto;touch-action:pan-y}
.tbox{width:min(640px,100%);padding:16px 18px 18px;text-align:center}
.logo span{display:block;font:800 clamp(34px,7vw,56px)/1 Oxanium,sans-serif;letter-spacing:.04em;background:linear-gradient(180deg,#f4fbff 20%,#7fe9ff 60%,#3a9fd0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 14px rgba(95,243,255,.25))}
.logo small{display:block;color:var(--dim);font-size:13px;margin-top:6px}
#tCont{margin-top:14px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.card{border:1.5px solid var(--edge);border-radius:12px;background:rgba(255,255,255,.03);padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.card canvas{width:84px;height:84px}
.card b{font-size:13px;white-space:nowrap}
.card small{font-size:11px;color:var(--dim);white-space:nowrap}
.card.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:0 0 0 1px var(--c) inset}
#fDesc{margin-top:10px;font-size:13px;font-weight:500;color:#cfe0e5;min-height:54px}
#fDesc .chips{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:6px}
#fDesc .chips span{font-size:11px;padding:2px 8px;border-radius:9px;border:1px solid var(--c);color:var(--ink);font-weight:600}
.nameRow{display:flex;gap:8px;margin-top:12px}
.nameRow input{flex:1;height:46px;border-radius:10px;border:1px solid var(--edge);background:rgba(0,0,0,.3);color:var(--ink);font:600 16px 'Chakra Petch',sans-serif;padding:0 12px;touch-action:auto;user-select:text;-webkit-user-select:text}
.nameRow input:focus,.btn:focus-visible,.card:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.primary{height:46px;padding:0 22px;border-radius:10px;border:0;background:linear-gradient(180deg,#5ff3ff,#2aa8d8);color:#04212a;font:800 16px Oxanium,sans-serif;white-space:nowrap}
.linkb{background:none;border:0;color:var(--dim);text-decoration:underline;font-size:13px;margin-top:10px;padding:6px}
.contc{display:flex;flex-direction:column;align-items:center;gap:4px}
.contc .primary{width:min(320px,100%)}
.keys{font-size:11px;color:var(--dim);margin-top:10px;font-weight:500}
@media (max-height:430px){
 #acts{transform:scale(.86)}
 #lt{width:196px;gap:5px}#plate{padding:5px 8px 6px}
 .bar{height:11px;margin-top:4px}.bar span{line-height:11px}
 #mmWrap{width:100px;height:100px}
 #bounty{top:calc(var(--st) + 114px);width:136px}
 #topBtns{right:calc(118px + var(--sr))}
 #tgt{top:64px}
 .tbox{padding:10px 14px 12px}.cards{margin-top:8px}.card canvas{width:64px;height:64px}#fDesc{margin-top:6px;min-height:0}
 .logo span{font-size:34px}.logo small{margin-top:3px}
}
@media (max-width:640px) and (orientation:portrait){
 #lt{width:calc(100% - 140px - var(--sl) - var(--sr))}
 #mmWrap{width:104px;height:104px}
 #siege,#tgt{position:static;transform:none;width:100%}
 #topBtns{right:calc(10px + var(--sr));top:calc(var(--st) + 118px)}
 #bounty{top:calc(var(--st) + 160px);width:120px}
 #log{width:62vw}
 #hint{bottom:calc(var(--sb) + 250px);max-width:88vw}
 #acts{transform:scale(.9)}
}
@media (prefers-reduced-motion:reduce){#banner,#joy{transition:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="vig"></div>
<div id="hud" class="hidden">
 <div id="lt">
 <div id="plate" class="pnl">
  <div class="pl-top"><span id="pFac" class="badge"></span><b id="pName"></b><span id="pLv" class="lv"></span></div>
  <div class="bar hp"><i id="bHp"></i><i id="bSh" class="sh"></i><span id="tHp"></span></div>
  <div class="bar fp"><i id="bFp"></i><span id="tFp"></span></div>
  <div class="bar xp"><i id="bXp"></i></div>
  <div id="buffs"></div>
 </div>
 <div id="wallet" class="pnl"><span><i style="background:#ffd34d"></i><b id="wCr">0</b></span><span><i style="background:#9fb3c3"></i><b id="wIron">0</b></span><span><i style="background:#5ad7ff"></i><b id="wLum">0</b></span><span><i style="background:#e6a8ff;border-radius:2px;transform:rotate(45deg)"></i><b id="wSh">0</b></span></div>
 <div id="siege" class="pnl">
  <div id="sgHead"><span id="sgTitle">Shields up</span><span id="sgTime">0:00</span></div>
  <div id="sgDom"></div>
  <div id="sgCores"><div class="cb" style="--c:var(--fer)"><i></i></div><div class="cb" style="--c:var(--aet)"><i></i></div><div class="cb" style="--c:var(--chr)"><i></i></div></div>
 </div>
 <div id="tgt" class="pnl hidden"><div id="tgName"><b></b><span></span></div><div class="bar"><i id="tgHp"></i></div></div>
 <div id="log"></div>
</div>
 <div id="mmWrap" class="pnl"><canvas id="mm"></canvas></div>
 <div id="bounty" class="pnl"></div>
 <div id="topBtns"><button class="tb" id="bMenu" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><button class="tb" id="bSnd" aria-label="Sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="sndWave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg></button></div>
 <div id="hint" class="hidden"></div>
 <div id="banner"><h2></h2><p></p></div>
 <div id="joy"><div id="knob"></div></div>
 <div id="cast" class="hidden"><div><i id="castBar"></i></div><span id="castTxt"></span></div>
 <div id="acts">
  <button class="act" id="aAtk" aria-label="Attack"><svg viewBox="0 0 24 24" fill="none" stroke="#ffd7cf" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2" fill="#ffd7cf"/><path d="M12 1.5v5M12 17.5v5M1.5 12h5M17.5 12h5"/></svg></button>
  <button class="act sk" id="aS0" data-i="0"></button>
  <button class="act sk" id="aS1" data-i="1"></button>
  <button class="act sk" id="aS2" data-i="2"></button>
  <button class="act pot" id="aHp" aria-label="Repair tonic"><svg viewBox="0 0 24 24"><path d="M9 2h6v3l-1 1v3.2a7 7 0 1 1-4 0V6L9 5z" fill="#ff5d6c" stroke="#ffd0d4" stroke-width="1.2"/><path d="M12 12v6M9 15h6" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg><span class="cnt" id="cHp">0</span></button>
  <button class="act pot" id="aFp" aria-label="Force cell"><svg viewBox="0 0 24 24"><path d="M9 2h6v3l-1 1v3.2a7 7 0 1 1-4 0V6L9 5z" fill="#3fb6ff" stroke="#cdeeff" stroke-width="1.2"/><path d="M13 11l-3 4h4l-3 4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="cnt" id="cFp">0</span></button>
  <button class="act off" id="aUse" aria-label="Interact"><svg id="useIco" viewBox="0 0 24 24"></svg><span class="nm" id="useNm"></span></button>
  <button class="act" id="aAuto">AUTO</button>
 </div>
</div>
<div id="death" class="hidden"><div><h2>Down</h2><p id="dBy"></p><p id="dT"></p></div></div>
<div id="panel" class="hidden"><div class="pbox pnl"><header><div id="ptabs"></div><button id="pClose" aria-label="Close">&#x2715;</button></header><div id="pbody"></div></div></div>
<div id="title">
 <div class="tbox pnl">
  <div class="logo"><span>RIFTFALL</span><small>Three nations at war over the Rift mine of planet Veyra</small></div>
  <div id="tCont" class="hidden"></div>
  <div id="tNew">
   <div class="cards" id="cards"></div>
   <div id="fDesc"></div>
   <div class="nameRow"><input id="nm" maxlength="14" placeholder="Call sign" autocomplete="off" spellcheck="false" aria-label="Character name"><button id="go" class="primary">Deploy</button></div>
   <div class="keys" id="keysTxt"></div>
  </div>
 </div>
</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);

function mk(o){return Object.assign({id:nextId++,x:0,y:0,r:14,hp:1,maxHp:1,atk:1,def:0,lvl:1,dead:false,buffs:{},cd:{},facing:0,walk:0,movT:0,flash:0,hitT:0,shield:0,name:''},o);}
function facStats(u){const c=CLS[u.f],l=u.lvl;
 u.maxHp=Math.round((c.hp+c.hpL*(l-1)+A_HP[u.aT])*(1+.06*u.aP));u.maxFp=Math.round(c.fp+c.fpL*(l-1));
 u.atk=(c.atk+c.atkL*(l-1)+W_ATK[u.wT])*(1+.08*u.wP);u.def=(c.def+c.defL*(l-1)+A_DEF[u.aT])*(1+.07*u.aP);
 u.range=c.range;u.rate=c.rate;u.spd=c.spd;u.crit=.1;}
function mobStats(m){const t=MOBS[m.type],l=m.lvl;m.name=t.name;m.r=t.r;m.spd=t.spd;
 if(t.boss){m.maxHp=9000;m.atk=140;m.def=50;m.rate=1.6;}else{m.maxHp=Math.round((30+l*27)*t.hpM);m.atk=(5+l*3.4)*t.atkM;m.def=l*1.4;m.rate=1.25;}
 m.hp=m.maxHp;}
function setMobLevel(m){const t=MOBS[m.type];m.lvl=Math.round(t.lv[0]+(t.lv[1]-t.lv[0])*clamp(m.band+rand(-.2,.2),0,1));mobStats(m);}

const effRate=u=>u.rate*(u.buffs.siege>0?.75:1)*(u.buffs.mech>0?1.15:1);

const nearAnyBase=(x,y,r)=>FK.some(k=>Math.hypot(x-FAC[k].x,y-FAC[k].y)<r);
const inOwnSafe=u=>FAC[u.f]&&dist(u,FAC[u.f])<BASE_R+30;
function canHit(a,b){
 if(!b||b===a||b.dead||b.kind==='tower')return false;
 if(b.kind==='core')return siege.on&&b.hp>0&&a.f!==b.f&&a.f!=='mob';
 if(a.f==='mob')return b.f!=='mob';
 if(b.f==='mob')return true;
 return a.f!==b.f;}
function topOf(e){if(e.kind==='core')return 112;if(e.kind==='tower')return 76;if(e.kind==='mob')return MOBS[e.type].h;return e.buffs.mech>0?60:48;}

function initWorld(){
 ents=[];projs=[];fx=[];texts=[];nodes=[];timers=[];towers=[];mobs=[];ais=[];cores={};
 FK.forEach(k=>{const a=ANG[k];
  const c=mk({kind:'core',f:k,x:C.x+Math.cos(a)*215,y:C.y+Math.sin(a)*215,r:30,maxHp:12000,hp:12000,def:45,name:FAC[k].short+' Heartcore'});cores[k]=c;ents.push(c);
  const b=FAC[k],ca=Math.atan2(C.y-b.y,C.x-b.x);
  [-.75,.75].forEach(o=>{const t=mk({kind:'tower',f:k,x:b.x+Math.cos(ca+o)*200,y:b.y+Math.sin(ca+o)*200,r:16,name:'Guard Tower'});t.cd.a=rand(0,1);towers.push(t);ents.push(t);});});
 const addMob=(type,x,y,band)=>{const m=mk({kind:'mob',f:'mob',type,home:{x,y},x,y,band,think:rand(0,1),wt:rand(0,3)});setMobLevel(m);mobs.push(m);ents.push(m);};
 const bands=[['behe',470,650,12],['hound',650,900,16],['volt',900,1150,18],['hog',1150,1420,22],['mite',1700,2200,10]];
 for(const [type,r0,r1,n] of bands){let made=0,tries=0;
  while(made<n&&tries<3000){tries++;const a=rand(0,Math.PI*2),r=rand(r0,r1),x=C.x+Math.cos(a)*r,y=C.y+Math.sin(a)*r;
   if(x<70||y<70||x>WW-70||y>WH-70||nearAnyBase(x,y,type==='mite'?BASE_R+100:type==='hog'?BASE_R+420:BASE_R+100))continue;
   addMob(type,x,y,1-(r-r0)/(r1-r0));made++;}}
 FK.forEach(k=>{const b=FAC[k];let made=0,tries=0;while(made<11&&tries<2000){tries++;const a=rand(0,Math.PI*2),r=rand(BASE_R+110,BASE_R+400),x=b.x+Math.cos(a)*r,y=b.y+Math.sin(a)*r;
  if(x<70||y<70||x>WW-70||y>WH-70)continue;addMob('mite',x,y,(r-BASE_R-110)/290);made++;}});
 const boss=mk({kind:'mob',f:'mob',type:'warden',boss:true,home:{x:C.x,y:C.y+10},x:C.x,y:C.y+10,band:1,think:0,wt:0});setMobLevel(boss);mobs.push(boss);ents.push(boss);
 let tries=0;while(nodes.filter(n=>n.kind==='iron').length<26&&tries<4000){tries++;
  const a=rand(0,Math.PI*2),r=rand(700,1950),x=C.x+Math.cos(a)*r,y=C.y+Math.sin(a)*r;
  if(x<80||y<80||x>WW-80||y>WH-80||nearAnyBase(x,y,BASE_R+60)||nodes.some(n=>Math.hypot(n.x-x,n.y-y)<160))continue;
  nodes.push({kind:'iron',x,y,ch:5,max:5,regen:0,s:rand(0,9)});}
 FK.forEach(k=>[-.42,.42].forEach(o=>{const a=ANG[k]+Math.PI/3+o;nodes.push({kind:'lumen',x:C.x+Math.cos(a)*330,y:C.y+Math.sin(a)*330,ch:4,max:4,regen:0,s:rand(0,9)});}));
 FK.forEach(k=>{for(let i=0;i<7;i++){const u=mk({kind:'ai',f:k,name:aiName(k),role:i<3?'hunt':i<6?'atk':'def',wT:0,wP:0,aT:0,aP:0,think:rand(0,1),mode:'roam'});levelAI(u);placeAtBase(u);
  if(i>=3){const a=ANG[k]+rand(-.6,.6),r=rand(600,1100);u.x=C.x+Math.cos(a)*r;u.y=C.y+Math.sin(a)*r;}ais.push(u);ents.push(u);}});
}
function aiName(k){const used=new Set(ais.map(a=>a.name));if(P)used.add(P.name);const pool=NAMES[k].filter(n=>!used.has(n));return pool.length?pick(pool):pick(NAMES[k])+'-'+ri(2,99);}
function levelAI(u){const pl=P?P.lvl:ri(4,14);
 u.lvl=u.role==='hunt'?clamp(pl+ri(-2,3),1,MAXLV):clamp(Math.max(12+ri(0,6),pl+ri(-1,4)),1,MAXLV);
 const tier=l=>{let t=0;for(let i=1;i<6;i++)if(TIER_LV[i]<=l)t=i;return t;};
 u.wT=clamp(tier(u.lvl)-ri(0,1),0,5);u.aT=clamp(tier(u.lvl)-ri(0,1),0,5);u.wP=ri(0,3);u.aP=ri(0,3);facStats(u);u.hp=u.maxHp;u.fp=u.maxFp;}
function placeAtBase(u,gate){const b=gate?GATE[u.f]:FAC[u.f];u.x=b.x+rand(-40,40);u.y=b.y+rand(-20,40);u.dead=false;u.hp=u.maxHp;u.fp=u.maxFp;u.buffs={};u.shield=0;u.tgt=null;u.goal=null;u.mode='roam';u.lastAtk=null;}

/* ---------- audio ---------- */
let AC=null,muted=false,noiseBuf=null;const sfxT={};
try{muted=localStorage.getItem('riftfall.mute')==='1';}catch(e){}
function ensureAudio(){if(muted)return;try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate*.5|0;noiseBuf=AC.createBuffer(1,n,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;}if(AC.state==='suspended')AC.resume();}catch(e){AC=null;}}
function tone(f0,f1,dur,type,vol,delay=0){const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.03);}
function noise(dur,vol,freq){const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;f.type='lowpass';f.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+dur);}
function sfx(n){if(!AC||muted)return;const now=performance.now();if(sfxT[n]&&now-sfxT[n]<55)return;sfxT[n]=now;try{switch(n){
 case'shot':tone(760,260,.08,'square',.022);break;case'orb':tone(480,920,.12,'sine',.04);break;case'shell':tone(190,70,.15,'sawtooth',.032);break;
 case'hit':noise(.06,.045,2400);break;case'boom':noise(.35,.11,700);tone(120,40,.3,'sine',.07);break;
 case'lvl':[523,659,784,1046].forEach((f,i)=>tone(f,f,.2,'triangle',.05,i*.09));break;case'horn':tone(110,104,1.3,'sawtooth',.045);tone(165,158,1.3,'sawtooth',.03);break;
 case'mine':tone(1500,900,.06,'triangle',.04);break;case'coin':tone(988,1318,.1,'square',.022);tone(1318,1568,.1,'square',.018,.08);break;
 case'heal':tone(420,840,.3,'sine',.04);break;case'fail':tone(320,90,.45,'sawtooth',.045);break;case'ui':tone(660,660,.04,'square',.018);break;case'hurt':tone(220,120,.1,'square',.03);break;}}catch(e){}}

/* ---------- fx ---------- */
function addFx(o){if(fx.length>360)fx.shift();fx.push(o);}
function sparks(x,y,col,n=6,sp=150){for(let i=0;i<n;i++)addFx({t:'p',x,y,vx:rand(-sp,sp),vy:rand(-sp*1.2,sp*.3),life:rand(.25,.5),max:.5,col,s:rand(1.5,3)});}
function ring(x,y,r,col,life=.4,w=3){addFx({t:'r',x,y,r,life,max:life,col,w});}
function flashFx(x,y,r,col,life=.2){addFx({t:'f',x,y,r,life,max:life,col});}
function beam(x1,y1,x2,y2,col,w=3){addFx({t:'b',x:x1,y:y1,x2,y2,life:.16,max:.16,col,w});}
function boom(x,y,r,col){flashFx(x,y-10,r*.8,col,.22);ring(x,y,r,col,.35,4);sparks(x,y-10,col,10,r*1.6);for(let i=0;i<4;i++)addFx({t:'s',x:x+rand(-r,r)*.4,y:y-10+rand(-r,r)*.3,vx:rand(-20,20),vy:rand(-40,-10),life:rand(.6,1),max:1,s:rand(8,14)});}
function healFx(u){for(let i=0;i<8;i++)addFx({t:'h',x:u.x+rand(-14,14),y:u.y-rand(5,40),vx:0,vy:-rand(30,60),life:rand(.6,1),max:1});ring(u.x,u.y,34,'#7ee8a2',.5,2);}
function ftext(x,y,txt,col,big){if(texts.length>70)texts.shift();texts.push({x:x+rand(-8,8),y,txt,col,big,life:.95,max:.95});}
function after(t,fn){timers.push({t,fn});}

function addLog(txt,col){const d=document.createElement('div');d.textContent=txt;if(col)d.style.color=col;ui.log.appendChild(d);while(ui.log.children.length>5)ui.log.firstChild.remove();setTimeout(()=>{d.style.opacity='0';setTimeout(()=>d.remove(),700);},7000);}

/* ---------- combat ---------- */
const PK={bolt:{spd:780,col:'#8feaff'},orb:{spd:520,col:'#eab6ff'},shell:{spd:600,col:'#ffb27a'},zap:{spd:480,col:'#9ffcff'},rocket:{spd:430,col:'#ffcf7a'},cannon:{spd:560,col:'#a8d6ff'}};
function shoot(owner,tgt,dmg,o={}){const k=o.kind||'bolt',d=PK[k];
 projs.push({x:o.ox??owner.x,y:o.oy??(owner.y-24),tgt,owner,dmg,kind:k,spd:o.spd||d.spd,col:o.col||d.col,splash:o.splash||0,life:2.2,vx:0,vy:0});}
function lob(owner,x,y,dur,onEnd){projs.push({kind:'lob',owner,sx:owner.x,sy:owner.y-20,ex:x,ey:y,x:owner.x,y:owner.y,t:0,dur,h:0,onEnd,life:9});}
function aoe(src,c,r,dmg){let n=0;for(const e of ents){if(!canHit(src,e))continue;if(Math.hypot(e.x-c.x,e.y-c.y)<r+e.r){dealDamage(src,e,dmg);n++;}}return n;}
function dealDamage(src,tgt,amt,o={}){
 if(!tgt||tgt.dead||tgt.kind==='tower')return 0;
 if(tgt.kind==='core'&&(!siege.on||tgt.hp<=0))return 0;
 let d=o.pure?amt:amt*70/(70+(tgt.def||0));
 const cr=!o.nocrit&&Math.random()<(src.crit||.06);if(cr)d*=1.7;
 if(tgt.buffs.wall>0)d*=.4;
 d=Math.max(1,Math.round(d*rand(.88,1.12)));
 const byP=src===P,onP=tgt===P;
 if(tgt.shield>0){const a=Math.min(tgt.shield,d);tgt.shield-=a;d-=a;if(d<=0){if(byP||onP)ftext(tgt.x,tgt.y-topOf(tgt),'absorbed','#a8d6ff');return 0;}}
 tgt.hp-=d;tgt.flash=.12;tgt.hitT=4;tgt.lastAtk=src;
 if(byP)tgt.tagP=true;
 if(tgt.kind==='mob'&&!tgt.returning)tgt.aggro=src;
 if(onP){P.combatT=5;if(P.mining)cancelMine();if(P.recall)cancelRecall('Recall interrupted');if(d>P.maxHp*.12)shake=Math.min(8,shake+3);sfx('hurt');}
 if(byP||onP)ftext(tgt.x,tgt.y-topOf(tgt),cr?d+'!':String(d),onP?'#ff6b6b':cr?'#ffd34d':'#ffffff',cr);
 if(tgt.kind==='core'){siege.dmg[src.f]=(siege.dmg[src.f]||0)+d;if(byP)siege.pDmg+=d;}
 if(tgt.hp<=0)kill(tgt,src);
 return d;}
function kill(t,src){
 t.hp=0;
 if(t.kind==='core'){boom(t.x,t.y-50,90,FAC[t.f].col);shake=10;addLog(`${FAC[t.f].name} Heartcore destroyed by ${FAC[src.f]?.name||'the Rift'}!`,FAC[t.f].lite);sfx('boom');
  if(FK.filter(k=>cores[k].hp>0).length<=1)endSiege();return;}

function doAct(a){const [k,x,y]=a.split(':');const keepHp=()=>{const r=P.hp/P.maxHp;facStats(P);P.hp=P.maxHp*r;};

 else if(k==='sell'){const n=P[x],v=n*(x==='iron'?12:60);if(!n)return;P[x]=0;P.credits+=v;pm(`Sold ${n} ${x} for ${v} cr`,'ok');sfx('coin');}

  P.credits-=TIER_CR[n];P.iron-=TIER_IRON[n];P.lumen-=TIER_LUM[n];if(x==='w')P.wT=n;else P.aT=n;keepHp();pm(`Forged ${gearName(x)}`,'ok');sfx('lvl');addLog(`New gear: ${gearName(x)}`,'#ffd34d');}
 else if(k==='glyph'){const p=x==='w'?P.wP:P.aP;if(p>=7)return;const sh=p+1,c=80*(p+1)*(p+1);if(P.shards<sh||P.credits<c)return pm('Not enough shards or credits','bad');P.shards-=sh;P.credits-=c;
  if(Math.random()*100<GLYPH_OK[p]){if(x==='w')P.wP++;else P.aP++;pm(`Success! ${gearName(x)}`,'ok');sfx('lvl');}
  else if(p>=3&&Math.random()<.35){if(x==='w')P.wP=0;else P.aP=0;pm('The glyph shattered. Back to +0.','bad');sfx('fail');shake=6;}
  else{pm('The inscription failed. Materials lost.','bad');sfx('fail');}keepHp();}
 else if(k==='war'){const cost={shard:6,hp:8,fp:8,iron:10}[x];if(P.wp<cost)return pm('Not enough war points','bad');P.wp-=cost;if(x==='shard')P.shards++;else if(x==='hp')P.hpPot+=5;else if(x==='fp')P.fpPot+=5;else P.iron+=20;pm('Delivered','ok');sfx('coin');}
 else if(k==='recall'){if(P.dead)return;P.recall={t:0,dur:3};P.engage=false;P.mining=null;closePanel();return;}
 else if(k==='snd'){muted=!muted;try{localStorage.setItem('riftfall.mute',muted?'1':'0');}catch(e){}if(!muted)ensureAudio();updSnd();}
 else if(k==='erase'){if(!eraseArm){eraseArm=true;renderPanel();return;}wipeSave();location.reload();return;}
 save();renderPanel();}
function updSnd(){ui.sndWave.style.opacity=muted?'.15':'1';}

/* ---------- input ---------- */
function s2w(x,y){return{x:(x-SW/2)/VS+camX,y:(y-SH/2)/VS+camY};}
function tapSelect(sx,sy){if(!P||P.dead)return;const w=s2w(sx,sy);let best=null,bd=1e9;
 for(const e of ents){if(e.dead||e===P||e.kind==='tower')continue;const d=Math.hypot(e.x-w.x,(e.y-topOf(e)*.45)-w.y);const lim=Math.max(30,e.r+14)+topOf(e)*.3;if(d<lim&&d<bd){bd=d;best=e;}}
 if(best&&canHit(P,best)){P.target=best;P.engage=true;if(P.mining)cancelMine();sfx('ui');return;}
 if(best&&best.kind!=='core'){P.target=null;P.engage=false;return;}
 const T=TERM[P.f];if(Math.hypot(T.x-w.x,T.y-20-w.y)<50&&dist(P,T)<170){openPanel('terminal');return;}
 for(const n of nodes)if(Math.hypot(n.x-w.x,n.y-w.y)<40&&dist(P,n)<95){startMine(n);return;}}
function onDown(e){if(!playing)return;ensureAudio();
 if(e.pointerType!=='mouse'&&e.clientX<SW*.5&&joy.id===null){joy.id=e.pointerId;joy.ox=e.clientX;joy.oy=e.clientY;joy.x=joy.y=0;joy.t0=performance.now();joy.moved=false;
  ui.joy.style.left=joy.ox+'px';ui.joy.style.top=joy.oy+'px';ui.joy.classList.add('on');ui.knob.style.transform='';try{cv.setPointerCapture(e.pointerId);}catch(_){}}
 else tapSelect(e.clientX,e.clientY);}
function onMove(e){if(e.pointerId!==joy.id)return;let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const d=Math.hypot(dx,dy),R=52;if(d>9)joy.moved=true;if(d>R){dx=dx/d*R;dy=dy/d*R;}joy.x=dx/R;joy.y=dy/R;ui.knob.style.transform=`translate(${dx}px,${dy}px)`;}
function onUp(e){if(e.pointerId!==joy.id)return;if(!joy.moved&&performance.now()-joy.t0<260)tapSelect(joy.ox,joy.oy);joy.id=null;joy.x=joy.y=0;ui.knob.style.transform='';ui.joy.classList.remove('on');ui.joy.style.left='';ui.joy.style.top='';}
cv.addEventListener('pointerdown',onDown);cv.addEventListener('pointermove',onMove);cv.addEventListener('pointerup',onUp);cv.addEventListener('pointercancel',onUp);
function press(el,fn){el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();ensureAudio();el.classList.add('press');fn();});const up=()=>el.classList.remove('press');el.addEventListener('pointerup',up);el.addEventListener('pointerleave',up);el.addEventListener('pointercancel',up);}
press(ui.aAtk,attackPress);[0,1,2].forEach(i=>press(ui['aS'+i],()=>useSkill(i)));press(ui.aHp,()=>usePot('hp'));press(ui.aFp,()=>usePot('fp'));press(ui.aUse,interact);
press(ui.aAuto,()=>{if(!P)return;P.auto=!P.auto;if(!P.auto)P.engage=false;toast(P.auto?'Auto-hunt on':'Auto-hunt off');});
ui.tgt.addEventListener('pointerdown',e=>{e.preventDefault();cycleTarget();});
ui.bMenu.addEventListener('click',()=>openPanel('menu'));ui.bSnd.addEventListener('click',()=>{muted=!muted;try{localStorage.setItem('riftfall.mute',muted?'1':'0');}catch(e){}if(!muted)ensureAudio();updSnd();});
ui.pClose.addEventListener('click',closePanel);ui.panel.addEventListener('pointerdown',e=>{if(e.target===ui.panel)closePanel();});
ui.ptabs.addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){panelTab=b.dataset.tab;pmsg={t:'',c:''};eraseArm=false;renderPanel();sfx('ui');}});
ui.pbody.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;doAct(b.dataset.act);});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;keys[e.code]=true;if(!playing||!P)return;ensureAudio();
 if(panelMode){if(e.code==='Escape'||e.code==='KeyM')closePanel();return;}
 switch(e.code){case'Space':case'KeyJ':attackPress();e.preventDefault();break;case'Digit1':case'KeyK':useSkill(0);break;case'Digit2':case'KeyL':useSkill(1);break;case'Digit3':useSkill(2);break;
  case'KeyQ':usePot('hp');break;case'KeyE':usePot('fp');break;case'KeyF':interact();break;case'Tab':cycleTarget();e.preventDefault();break;case'KeyR':P.auto=!P.auto;if(!P.auto)P.engage=false;toast(P.auto?'Auto-hunt on':'Auto-hunt off');break;case'KeyM':case'Escape':openPanel('menu');break;}});
addEventListener('keyup',e=>{keys[e.code]=false;});addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});

/* ---------- title ---------- */
let selF='ferros';const previews=[];
function buildTitle(){const s=loadSave();
 ui.cards.innerHTML=FK.map(k=>`<button class="card${k===selF?' on':''}" data-f="${k}" style="--c:${FAC[k].col}"><canvas width="168" height="168"></canvas><b>${FAC[k].short}</b><small>${FAC[k].role}</small></button>`).join('');
 [...ui.cards.children].forEach(b=>{previews.push({f:b.dataset.f,c:b.querySelector('canvas')});b.addEventListener('click',()=>{selF=b.dataset.f;[...ui.cards.children].forEach(x=>x.classList.toggle('on',x===b));descF();sfx('ui');});});
 descF();ui.keysTxt.textContent=isTouch?'Best played in landscape.':'WASD move · Space attack · 1 2 3 skills · F mine · M menu';
 if(s){ui.tCont.classList.remove('hidden');ui.tNew.classList.add('hidden');
  ui.tCont.innerHTML=`<div class="contc"><button class="primary" id="cont">Continue as ${esc(s.p.name)}</button><small style="color:var(--dim)">Lv ${s.p.lvl} ${FAC[s.p.f].name}</small><button class="linkb" id="newc">New character</button></div>`;
  $('cont').addEventListener('click',()=>startGame(s.p,s.dom));
  $('newc').addEventListener('click',()=>{ui.tCont.classList.add('hidden');ui.tNew.classList.remove('hidden');ui.keysTxt.textContent=`Deploying a new character replaces ${s.p.name} (Lv ${s.p.lvl}).`;});}}
function descF(){const F=FAC[selF];ui.fDesc.style.setProperty('--c',F.col);ui.fDesc.innerHTML=`<div>${F.blurb}</div><div class="chips">${CLS[selF].skills.map(s=>`<span>${s.name}</span>`).join('')}</div>`;}
ui.go.addEventListener('click',()=>{let n=ui.nm.value.trim().replace(/\s+/g,' ').slice(0,14);if(!n)n='Recruit-'+ri(100,999);
 startGame({name:n,f:selF,lvl:1,xp:0,credits:120,iron:0,lumen:0,shards:1,hpPot:5,fpPot:3,wT:0,wP:0,aT:0,aP:0,wp:0,kills:0,pk:0,deaths:0,wins:0,bounty:null,tut:0},null);});
ui.nm.addEventListener('keydown',e=>{if(e.key==='Enter')ui.go.click();});
function drawPreviews(t){if(ui.title.classList.contains('hidden'))return;for(const p of previews){const c=p.c.getContext('2d');ctx=c;c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,168,168);
 c.setTransform(2.6,0,0,2.6,84,140);const u={id:p.f.length,f:p.f,kind:'ai',r:14,walk:t*7,movT:1,facing:Math.sin(t*.7)*.3,buffs:{},flash:0,shield:0};
 if(p.f==='ferros'&&Math.sin(t*.5)>.6)u.buffs.mech=1;drawBody(u,t);}ctx=mainCtx;}
function startGame(data,dom){ensureAudio();P=mk(Object.assign({kind:'player',r:14,auto:false},data));if(P.tut==null)P.tut=0;facStats(P);P.hp=P.maxHp;P.fp=P.maxFp;
 placeAtBase(P);ents=ents.filter(e=>e.kind!=='player');ents.push(P);if(!P.bounty)newBounty();
 siege.dom=dom&&FAC[dom]?dom:siege.dom;siege.on=false;siege.t=100;siege.warned=0;FK.forEach(k=>cores[k].hp=cores[k].maxHp);
 ais.forEach(a=>{if(a.name.toLowerCase()===P.name.toLowerCase())a.name=aiName(a.f);levelAI(a);if(a.role==='hunt')placeAtBase(a);});
 ui.title.classList.add('hidden');ui.hud.classList.remove('hidden');ui.pFac.style.setProperty('--c',FAC[P.f].col);ui.pName.textContent=P.name;buildSkillBtns();playing=true;camX=P.x;camY=P.y;
 save();addLog(`Welcome, ${P.name} of the ${FAC[P.f].name}.`,FAC[P.f].lite);if(P.tut<5)setTimeout(showHint,900);updSnd();}

/* ---------- loop ---------- */
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);SW=innerWidth;SH=innerHeight;cv.width=Math.round(SW*DPR);cv.height=Math.round(SH*DPR);
 VS=clamp(Math.min(SW,SH)/470,.62,1.25);if(SW>900&&SH>620)VS=clamp(Math.min(SW,SH)/640,.85,1.3);mmResize();}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));
let last=performance.now(),saveT=0,acc=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 try{update(dt);if(P){updHud(dt);mmT-=dt;if(mmT<=0){mmT=.2;drawMM();}saveT+=dt;if(saveT>8){saveT=0;save();}}render(dt);drawPreviews(now/1000);}catch(err){console.error(err);}
 requestAnimationFrame(frame);}
resize();mkGrads();initWorld();buildTitle();requestAnimationFrame(frame);
window.RF={get P(){return P;},get siege(){return siege;},get ais(){return ais;},get cores(){return cores;},get mobs(){return mobs;},step(sec,h=1/30){for(let t=0;t<sec;t+=h)update(h);},recalc(){facStats(P);P.hp=P.maxHp;P.fp=P.maxFp;},startSiege,endSiege,startGame,attackPress,useSkill,interact,openPanel};
})();
</script>
